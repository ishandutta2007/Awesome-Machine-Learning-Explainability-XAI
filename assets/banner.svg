<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{r:5px;opacity:.4}}@keyframes float{0%{transform:translateY(0)}}.neural-line{stroke-dasharray:8 12;animation:dashMove 20s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.floating-pill{animation:float 6s ease-in-out infinite alternate}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#38bdf8" stroke-width="1" opacity=".12"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/